apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-ai-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: industrial-ai-agent
  template:
    metadata:
      labels:
        app: industrial-ai-agent
    spec:
      containers:
        - name: api
          image: industrial-ai-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-ai-agent-svc
spec:
  selector:
    app: industrial-ai-agent
  ports:
    - port: 80
      targetPort: 8080
