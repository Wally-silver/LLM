[project]
name = "industrial-ai-agent"
version = "0.1.0"
description = "Modular industrial-grade AI Agent system with FastAPI, RAG, vLLM, and LangGraph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "redis>=5.0.7",
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0.1",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "numpy>=1.26.0",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
